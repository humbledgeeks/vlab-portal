<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Portal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span><span id="site-name">Lab Portal</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <a href="#/account" id="who-name" class="who-name"></a>
      <button class="btn ghost small" id="logout">Sign out</button>
    </div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <div id="toasts" class="toasts" role="status"></div>

</html>
